<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b5483a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRUC">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TRUC! — Joc menorquí</title>
<style>
/* ============ TRUC MENORQUÍ — prototip estil còmic ============ */
:root{
  --ink:#22201a;          /* tinta */
  --paper:#f6eed9;        /* papel de diari */
  --paper2:#efe3c4;
  --wood:#a08050;         /* fusta aiguada sèpia */
  --wood2:#7c5f38;
  --red:#b5483a;          /* vermell apagat de tinta */
  --gold2:#e3b341;
  --wash:#d8d2c0;         /* gris aiguada */
  --bubble:#fbf6e8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Chalkboard SE','Comic Sans MS','Segoe Print',cursive,sans-serif;
  /* paper d'es diari amb una mica de gra */
  background:
    repeating-linear-gradient(0deg, rgba(34,32,26,.022) 0 2px, transparent 2px 5px),
    radial-gradient(circle at 50% 18%, #faf4e2 0%, var(--paper) 50%, #e2d4ae 100%);
  color:var(--ink);
}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden}
.hidden{display:none!important}

/* ---------- Comic basics ---------- */
.comic-border{border:4px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
button{
  font-family:inherit;font-weight:bold;border:4px solid var(--ink);border-radius:14px;
  box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;color:var(--ink);
}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}

/* ---------- Config screen ---------- */
#scrConfig{justify-content:center;gap:14px;padding:16px;text-align:center;
  background:
    repeating-linear-gradient(0deg, rgba(34,32,26,.025) 0 2px, transparent 2px 5px),
    radial-gradient(circle at 50% 15%, #faf4e2 0%, var(--paper) 45%, #ddcca2 100%)}
#titleWrap{position:relative}
h1.logo{
  font-size:min(21vw,110px);letter-spacing:2px;color:var(--red);
  text-shadow:4px 4px 0 var(--ink), 8px 8px 0 rgba(0,0,0,.25);
  transform:rotate(-4deg);
}
h1.logo span{color:#fff;text-shadow:4px 4px 0 var(--ink),8px 8px 0 rgba(0,0,0,.25)}
.subtitle{font-size:16px;background:var(--bubble);display:inline-block;padding:6px 14px;border:3px solid var(--ink);
  border-radius:30px;transform:rotate(2deg);box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.cfgCard{background:var(--paper);padding:14px 18px;width:min(92vw,380px);display:flex;flex-direction:column;gap:12px}
.cfgRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cfgRow .lbl{font-weight:bold;text-align:left;font-size:15px}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:none;border-radius:0;box-shadow:none;padding:8px 14px;font-size:14px;background:#fff}
.seg button.on{background:var(--red);color:#fff}
.bigStart{font-size:24px;padding:14px 30px;background:var(--red);color:#fff;transform:rotate(-1deg)}
.miniNote{font-size:11px;opacity:.75}

/* ---------- Game screen layout ---------- */
#scrGame{padding:0}
#topBar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;gap:6px;z-index:30}
#scoreBox{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;
  font-size:13px;font-weight:bold;box-shadow:3px 3px 0 rgba(0,0,0,.3);display:flex;gap:10px;align-items:center}
.scTeam{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.scTeam .pts{font-size:18px}
.cames{font-size:11px;letter-spacing:2px}
#btnMusic,#btnHelp{width:42px;height:42px;font-size:20px;background:var(--paper);border-radius:50%;padding:0}
#msgLine{min-height:22px;font-size:13px;font-weight:bold;background:rgba(255,255,245,.92);border:3px solid var(--ink);
  border-radius:20px;padding:3px 14px;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:3px 3px 0 rgba(0,0,0,.3);z-index:30}

#tableArea{position:relative;flex:1;width:100%}
/* contenidor de proporció fixa: tot queda al seu lloc a qualsevol pantalla */
#tableInner{position:absolute;inset:0;margin:auto;aspect-ratio:0.92;
  max-width:520px;max-height:100%;width:100%}

/* the wooden table */
#mesa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:92%;aspect-ratio:1.15;border-radius:50%;
  background:
   repeating-linear-gradient(95deg, rgba(34,32,26,.10) 0 2px, transparent 2px 14px),
   repeating-linear-gradient(92deg, rgba(34,32,26,.05) 0 12px, rgba(255,255,255,.06) 12px 26px),
   radial-gradient(circle at 45% 35%, #b6945f 0%, var(--wood) 55%, var(--wood2) 100%);
  border:5px solid var(--ink);box-shadow:0 12px 0 rgba(34,32,26,.3), inset 0 -10px 0 rgba(34,32,26,.16);
}
/* played cards slots on the table */
.slot{position:absolute;width:72px;height:108px;transform:translate(-50%,-50%);z-index:12}
#slot0{left:50%;top:74%}
#slot1{left:72%;top:48%}
#slot2{left:50%;top:30%}
#slot3{left:28%;top:48%}

/* mazo de cartes sobrants: es posa a la dreta del qui reparteix */
#mazo{position:absolute;width:46px;height:69px;transform:translate(-50%,-50%);z-index:8}
#mazo .card{width:46px;height:69px;position:absolute;left:0;top:0}
#mazo .card:nth-child(2){transform:translate(3px,-2px) rotate(5deg)}
#mazo .card:nth-child(3){transform:translate(-3px,2px) rotate(-4deg)}
#mazo .card.back:after{font-size:16px}
.slot .card{position:absolute;inset:0}

/* ---------- Players (ben grossos!) ---------- */
.player{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:10;width:124px}
.player .avatar{width:110px;height:110px;filter:drop-shadow(3px 4px 0 rgba(34,32,26,.3))}
.player .pname{font-size:13px;font-weight:bold;background:var(--paper);border:3px solid var(--ink);
  border-radius:10px;padding:1px 10px;margin-top:-10px;box-shadow:2px 2px 0 rgba(34,32,26,.3);
  position:relative;z-index:6} /* es nom sempre per damunt des monigot */
.player.turn .pname{background:var(--gold2)}
.player .ncards{font-size:11px;margin-top:2px;letter-spacing:1px}
#pl1{right:-2%;top:22%}
#pl2{left:50%;top:-2%;transform:translateX(-50%)}
#pl3{left:-2%;top:22%}

/* speech bubble */
.bubble{position:absolute;background:var(--bubble);border:3px solid var(--ink);
  border-radius:55% 45% 60% 40% / 60% 55% 45% 50%; /* bafarada irregular, a mà */
  padding:10px 18px;font-size:19px;font-weight:bold;z-index:40;box-shadow:3px 3px 0 rgba(34,32,26,.3);
  white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;
  transform:translate(-50%,-100%);animation:pop .18s ease-out}
.bubble:after{content:'';position:absolute;bottom:-14px;left:24px;border:8px solid transparent;border-top-color:var(--ink)}
.bubble.shout{font-size:23px;color:var(--ink);
  border-width:4px;border-radius:18px 60% 20px 55% / 55% 22px 60% 18px;
  animation:popShout .18s ease-out;transform:translate(-50%,-100%) rotate(-3deg)}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.2)}to{transform:translate(-50%,-100%) scale(1)}}
@keyframes popShout{from{transform:translate(-50%,-100%) rotate(-3deg) scale(.2)}to{transform:translate(-50%,-100%) rotate(-3deg) scale(1)}}

/* ---------- Cards (baralla espanyola) ---------- */
.card{
  width:72px;height:108px;background:#fff;border:2.5px solid var(--ink);border-radius:7px;
  box-shadow:3px 3px 0 rgba(34,32,26,.32);position:relative;font-weight:bold;
}
.card svg{display:block;width:100%;height:100%}
.card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:5px}
.card .peca{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-size:8px;
  background:var(--red);color:#fff;border-radius:6px;
  padding:0 5px;border:2px solid var(--ink);white-space:nowrap;z-index:2}
.card.back{background:
  repeating-linear-gradient(45deg, rgba(34,32,26,.25) 0 3px, transparent 3px 9px),
  repeating-linear-gradient(-45deg, rgba(34,32,26,.18) 0 3px, transparent 3px 9px),
  var(--red);}
.card.back:after{content:'☼';color:var(--paper);font-size:26px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px 0 var(--ink)}

/* player hand */
#handArea{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 8px 14px;z-index:20;width:100%}
/* barra d'accions: mínim fix, però amb moltes opcions fa dues files (tot visible!) */
#actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;
  min-height:54px;max-width:100vw}
#actions button{font-size:14px;padding:8px 10px;background:var(--paper);white-space:nowrap}
#actions button.atk{background:var(--red);color:#fff}
#actions button.flash{background:var(--gold2)}
#hand{display:flex;gap:10px}
#hand .card{width:98px;height:147px;transition:transform .15s}
#hand .card .peca{font-size:10px;padding:0 7px}
#hand .card.playable{cursor:pointer}
#hand .card.playable:active{transform:translateY(-12px)}
#hand .card.dim{opacity:.45}

/* (es gin ara és a sa prestatgeria des bar: damunt sa taula tapava ses cartes) */

/* ---------- Flash overlay (senyes) ---------- */
#flashOverlay{position:fixed;inset:0;background:rgba(255,255,255,.65);z-index:90;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:10px}
#flashOverlay .fcards{display:flex;gap:12px}
#flashOverlay .card{width:108px;height:162px}
#flashOverlay .ftxt{font-size:22px;font-weight:bold;background:var(--gold2);border:4px solid var(--ink);
  border-radius:16px;padding:6px 18px;box-shadow:4px 4px 0 rgba(0,0,0,.35);transform:rotate(-2deg)}

/* ---------- Modal (decisions) — abaix, que es vegin les cartes de la taula! ---------- */
#modal{position:fixed;inset:0;background:linear-gradient(rgba(34,32,26,0) 55%, rgba(34,32,26,.35));
  z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:10px}
#modalCard{background:var(--paper);padding:12px 14px;width:min(94vw,400px);text-align:center;
  display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
#modalTitle{font-size:18px;font-weight:bold}
#modalSub{font-size:12px;opacity:.8}
#modalBtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#modalBtns button{font-size:15px;padding:9px 12px;background:#fff;flex:1 1 40%}
#modalBtns button.atk{background:var(--red);color:#fff}
#modalBtns button.safe{background:#cfe8cf}

/* mini-reproductor de Joana Pons (YouTube oficial) */
#ytPlayer{position:fixed;right:6px;top:56px;width:176px;height:99px;z-index:60;
  border:3px solid var(--ink);border-radius:10px;overflow:hidden;
  box-shadow:3px 3px 0 rgba(34,32,26,.35);background:#000}
#ytPlayer iframe{width:100%;height:100%;border:0;display:block}

/* toast center */
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-2deg);z-index:85;
  background:#ffe14d;border:4px solid var(--ink);border-radius:18px;padding:12px 22px;font-size:26px;
  font-weight:bold;color:var(--red);text-shadow:1px 1px 0 var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.4);
  animation:pop .2s ease-out}

@media (max-height:640px){
  .player .avatar{width:80px;height:80px}
  #hand .card{width:80px;height:120px}
  .card{width:62px;height:93px}
}
/* mòbils estrets: tot una mica més recollit */
@media (max-width:430px){
  .player .avatar{width:90px;height:90px}
  .player{width:104px}
  #hand .card{width:30vw;max-width:98px;height:45vw;max-height:147px}
  .bubble{font-size:16px;padding:8px 14px}
  .bubble.shout{font-size:20px}
  #actions button{font-size:13px;padding:8px 8px}
  #scoreBox{font-size:11px}
  #scoreBox .pts{font-size:15px}
}
button,.card{touch-action:manipulation} /* sense zoom accidental amb dits ràpids */

/* ---------- Escenari: bar menorquí amb vista a una cala ---------- */
#barScene{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#barScene svg{width:100%;height:100%;display:block}
#scrGame #topBar,#scrGame #msgLine{position:relative;z-index:30}
#scrGame #tableArea{z-index:1}
#scrGame #handArea{position:relative;z-index:20}
</style>
</head>
<body>

<!-- ================= CONFIG SCREEN ================= -->

  <div id="titleWrap">
    <h1 class="logo">TRUC<span>!</span></h1>

        <button data-v="es">Castellano</button>

    <div class="miniNote">v1.0 · Cartes: Basquetteur — Wikimedia Commons, CC BY-SA 3.0</div>
  </div>
  <div style="width:90px" id="cfgGin"></div>
</div>

<!-- ================= GAME SCREEN ================= -->
<div id="scrGame" class="screen hidden">
  <div id="barScene"></div>
  <div id="topBar">
    <div id="scoreBox">
      <div class="scTeam"><span id="lblNoltros">NOLTROS</span><span class="pts" id="ptsN">0</span><span class="cames" id="camN"></span></div>
      <div id="phase" style="font-size:10px;text-align:center;line-height:1.2">⚔</div>
      <div class="scTeam"><span id="lblElls">ELLS</span><span class="pts" id="ptsE">0</span><span class="cames" id="camE"></span></div>
    </div>
    <div style="display:flex;gap:6px">
      <button id="btnHelp">🤫</button>
      <button id="btnMusic">🎸</button>
    </div>
  </div>
  <div id="msgLine">&nbsp;</div>

  <div id="tableArea">
   <div id="tableInner">
    <div id="mesa"></div>
    <div id="mazo"></div>
    <div class="slot" id="slot0"></div>
    <div class="slot" id="slot1"></div>
    <div class="slot" id="slot2"></div>
    <div class="slot" id="slot3"></div>
    <div class="player" id="pl1"><div class="avatar" data-av="toni"></div><div class="pname">Toni</div><div class="ncards"></div></div>
    <div class="player" id="pl2"><div class="avatar" data-av="maria"></div><div class="pname">Maria</div><div class="ncards"></div></div>
    <div class="player" id="pl3"><div class="avatar" data-av="biel"></div><div class="pname">Biel</div><div class="ncards"></div></div>
   </div>
  </div>

  <div id="handArea">
    <div id="actions"></div>
    <div id="hand"></div>
  </div>
</div>

<!-- overlays -->
<div id="flashOverlay" class="hidden"></div>
<div id="modal" class="hidden"><div id="modalCard" class="comic-border">
  <div id="modalTitle"></div><div id="modalSub"></div><div id="modalBtns"></div>
</div></div>
<div id="toast" class="hidden"></div>

 for(const s of SUITS) for(let n=1;n<=7;n++){
   if(n===2 && !withDoses) continue;
   d.push({s,n});
 }
 d.push({s:"B",n:11}); // l'amo
 d.push({s:"O",n:10}); // sa madona
 return d;
}
function isAmo(c){return c.s==="B"&&c.n===11}
function isMadona(c){return c.s==="O"&&c.n===10}
function rank(c){ // més alt = guanya
 if(isAmo(c))return 13;
 if(isMadona(c))return 12;
 if(c.s==="E"&&c.n===1)return 11;   // espaseta
 if(c.s==="B"&&c.n===1)return 10;   // bastet
 if(c.s==="E"&&c.n===7)return 9;    // manilla d'espases
 if(c.s==="O"&&c.n===7)return 8;    // manilla d'oros
 if(c.n===3)return 7;
 if(c.n===2)return 6;               // moixets (si es juga amb dosos)
 if(c.n===1)return 5;               // asos bords (O,C)
 if(c.n===7)return 4;               // sets bords (C,B)
 if(c.n===6)return 3;
 if(c.n===5)return 2;
 return 1;                          // quatres
}
function pecaName(c){
 if(isAmo(c))return "l'amo";
 if(isMadona(c))return "madona";
 if(c.s==="E"&&c.n===1)return "espaseta";
 if(c.s==="B"&&c.n===1)return "bastet";
 if(c.n===7&&(c.s==="E"||c.s==="O"))return "manilla";
 return null;
}
/* valor d'envit d'una mà de 3 cartes */
function envitValue(hand){
 let best=0;
 for(let i=0;i<hand.length;i++)for(let j=i+1;j<hand.length;j++){
   const a=hand[i],b=hand[j];let v=0;
   if((isAmo(a)&&isMadona(b))||(isAmo(b)&&isMadona(a))) v=35;
   else if(isAmo(a)) v=28+idxEnvit(b);
   else if(isAmo(b)) v=28+idxEnvit(a);
   else if(isMadona(a)) v=27+idxEnvit(b);
   else if(isMadona(b)) v=27+idxEnvit(a);
   else if(a.s===b.s) v=20+idxEnvit(a)+idxEnvit(b);
   if(v>best)best=v;
 }
 if(best===0) best=Math.max(...hand.map(idxEnvit)); // simplificació: sense lligat
 return best;
}
function idxEnvit(c){return c.n<=7?c.n:0}

/* força de mà pel truc (heurística IA) */
function handStrength(hand){
 const rs=hand.map(rank).sort((a,b)=>b-a);
 return rs[0]*2.2+rs[1]*1.3+rs[2]*0.4; // ~3.9 .. ~45
}

function renderTable(){
 // ses cartes queden damunt sa taula: sa volta nova tapa s'anterior,
 // però es veu un bocinet de sa carta de davall
 for(let s=0;s<4;s++){
   const slot=$("#slot"+s);slot.innerHTML="";
   const stack=[];
   (G.history||[]).forEach(b=>{if(b.cards[s])stack.push(b.cards[s])});
   if(G.played[s])stack.push(G.played[s]);
   stack.forEach((c,i)=>{
     const d=cardEl(c);
     const depth=stack.length-1-i; // 0 = sa de damunt
     d.style.zIndex=10+i;
     d.style.transform=`translate(${-depth*12}px,${-depth*16}px) rotate(${-depth*6}deg)`;
     if(depth>0)d.style.filter="brightness(.9)";
     slot.appendChild(d);
   });
 }
 for(const s of[1,2,3]){
   $("#pl"+s+" .ncards").textContent="🃏".repeat(G.hands[s].length);
   $("#pl"+s).classList.toggle("turn",G.inHand&&G.turn===s);
 }

 $("#phase").innerHTML="CAMA "+(G.cames.N+G.cames.E+1)+"<br>"+t("voltaLbl")+" "+G.baza+"/3";
 // mazo de sobrants al costat del repartidor (marca qui és mà)

 }
 // Senya d'envit a na Maria (abans que li toqui tirar)
 if(G.baza===1&&G.envit.open&&G.envit.level<0&&!G.askEnvit&&!G.played[2]){
   const b=el("button","flash",t("senyaEnvit"));
   b.onclick=()=>{G.askEnvit=true;toast(t("senyaEnvitFeta"),1400);renderActions()};

/* ---------------- Punts ---------------- */
function addPoints(team,pts){ // retorna true si s'ha acabat la cama
 if(pts==="cama"){G.score[team]=24}
 else G.score[team]=Math.min(24,G.score[team]+pts);
 renderScore();
 return G.score[team]>=24;
}
function faltaCap(p){ // l'envit mai supera el que li falta al que va davant
 const rem=Math.min(24-G.score.N,24-G.score.E);
 return p==="tots"?rem:Math.min(p,rem);
}

/* ---------------- Cicle: partida / cama / mà ---------------- */
function startMatch(){
 G.score={N:0,E:0};G.cames={N:0,E:0};G.matchOver=false;G.dealer=3;
 // companys de taula nous a cada partida, cadascú amb es seu caràcter
 const hs=POOL_HOMES.slice().sort(()=>Math.random()-.5);
 NAMES[1]=hs[0];NAMES[3]=hs[1];
 NAMES[2]=POOL_DONES[Math.floor(Math.random()*POOL_DONES.length)];
 for(const s of[1,2,3])$("#pl"+s+" .pname").textContent=NAMES[s];
 G.aggro=[1,.75+Math.random()*.55,.75+Math.random()*.55,.75+Math.random()*.55];
 renderScore();startHand();
}
function startCamaWin(team){
 G.cames[team]++;renderScore();
 toast((team==="N"?t("camaGuanyada"):t("camaPerduda"))+" 🥂 "+G.cames.N+"–"+G.cames.E,2600);
 if(G.cames[team]>=2){
   G.matchOver=true;
   setTimeout(()=>showModal(team==="N"?t("victoria"):t("derrota"),"",
     [[t("novaPartida"),"atk",()=>{$("#scrGame").classList.add("hidden");$("#scrConfig").classList.remove("hidden")}]]),1900);
   return;
 }
 G.score={N:0,E:0};renderScore();
 setTimeout(startHand,2000);
}
function startHand(){
 if(G.matchOver)return;
 G.dealer=(G.dealer+1)%4;G.maSeat=(G.dealer+1)%4;
 const deck=buildDeck(G.withDoses);
 for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 for(let s=0;s<4;s++)G.hands[s]=deck.splice(0,3);
 G.hands0snap=G.hands.map(h=>h.slice()); // còpia per resoldre l'envit al final
 G.played=[null,null,null,null];G.trickWinners=[];G.baza=1;
 G.truc={val:1,level:-1,canRaise:null,pending:false};
 G.envit={open:true,accepted:false,val:0,level:-1,pending:false};
 G.flashPlayer=false;G.flashMaria=false;G.mariaKnows=false;
 G.askEnvit=false;G.history=[];
 G.leader=G.maSeat;G.turn=G.maSeat;G.inHand=true;
 setMsg(G.dealer===0?t("dealsTu"):NAMES[G.dealer]+" "+t("deals"));
 G.partnerHint=null;
 renderTable();renderHand(false);renderActions();
 // sa companya fa sa senya de sa seva millor peça, com a sa taula:
 // un gest que has de saber llegir (botó 🤫 per repassar es codi)
 const sy=senyaForHand(G.hands[2]);
 const willSenya=sy.rank>=7?Math.random()<.7:Math.random()<.3;
 setTimeout(()=>{
   if(willSenya){G.flashMaria=true;
     bubble(2,sy.e+" "+t(sy.k));
     setMsg((LANG==="ca"?"Na ":"")+NAMES[2]+" "+t(sy.k)+"...");
     setTimeout(nextTurn,1700);}
   else nextTurn();
 },1500);
}
/* sa senya tradicional que toca per sa millor peça de sa mà (codi de llevant) */
function senyaForHand(hand){
 if(hand.some(isAmo))return{e:"👄",k:"gAmo",rank:13};
 if(hand.some(isMadona))return{e:"🤨",k:"gMadona",rank:12};
 if(hand.some(c=>c.s==="E"&&c.n===1))return{e:"😉",k:"gEspaseta",rank:11};
 if(hand.some(c=>c.s==="B"&&c.n===1))return{e:"😉",k:"gBastet",rank:10};
 if(hand.some(c=>c.s==="E"&&c.n===7))return{e:"😛",k:"gManE",rank:9};
 if(hand.some(c=>c.s==="O"&&c.n===7))return{e:"😛",k:"gManO",rank:8};
 if(hand.some(c=>c.n===3))return{e:"😏",k:"gTres",rank:7};
 return{e:"😑",k:"gRes",rank:0};
}

/* ---------------- Torn de joc ---------------- */
function nextTurn(){
 if(!G.inHand||G.matchOver)return;
 renderTable();
 if(G.turn===0){setMsg(t("yourTurn")+(G.turn===G.maSeat?" ("+t("maTurn")+")":""));
   renderHand(true);renderActions();}
 else{setMsg(NAMES[G.turn]+"...");renderHand(false);renderActions();
   setTimeout(()=>aiTurn(G.turn),1500+Math.random()*1100);}
}
function playerPlays(i){
 if(!(G.inHand&&G.turn===0&&!G.truc.pending&&!G.envit.pending))return;
 playCard(0,i);
}
function playCard(seat,idx){
 const c=G.hands[seat].splice(idx,1)[0];
 G.played[seat]=c;renderTable();renderHand(false);renderActions();
 advanceAfterCard(seat);
}
function advanceAfterCard(seat){
 const next=(seat+1)%4;
 const cardsDown=G.played.filter(Boolean).length;
 if(cardsDown===4){setTimeout(resolveTrick,1700)}
 else{G.turn=next;setTimeout(nextTurn,750)}
}
function resolveTrick(){
 G.partnerHint=null; // ses ordres de taula només valen per sa volta en curs
 if(G.baza===1)G.envit.open=false; // l'envit es tanca en acabar la 1a volta
 const ranks=G.played.map(c=>rank(c));
 const maxR=Math.max(...ranks);
 const topSeats=[0,1,2,3].filter(s=>ranks[s]===maxR);
 const topTeams=new Set(topSeats.map(teamOf));
 let winnerTeam=null,winnerSeat=null;
 if(topTeams.size===1){
   winnerTeam=teamOf(topSeats[0]);
   // dins de l'equip guanyador, el que ha jugat primer (des del leader)
   for(let k=0;k<4;k++){const s=(G.leader+k)%4;if(topSeats.includes(s)){winnerSeat=s;break}}
 }
 G.trickWinners.push(winnerTeam);
 G.history.push({cards:G.played.slice(),winner:winnerTeam});
 if(winnerTeam){setMsg(winnerSeat===0?t("guanyaBasaTu"):NAMES[winnerSeat]+" "+t("guanyaBasa"));}
 else{setMsg(t("parda"));toast(t("parda"),900)}
 const outcome=handOutcome();
 setTimeout(()=>{
   G.played=[null,null,null,null];
   if(outcome){endHand(outcome)}
   else{
     G.baza++;
     G.leader=winnerSeat!==null?winnerSeat:G.leader; // simplificació pardes
     G.turn=G.leader;renderTable();nextTurn();
   }
 },2700);
}
function handOutcome(){
 const w=G.trickWinners,c={N:0,E:0};w.forEach(x=>x&&c[x]++);
 if(c.N>=2)return"N";if(c.E>=2)return"E";
 if(w.length===2){
   if(w[0]===null&&w[1])return w[1];      // empat 1a: guanya qui mata la 2a
   if(w[0]&&w[1]===null)return w[0];      // empat 2a: guanya qui guanyà la 1a
   return null;
 }
 if(w.length===3){
   if(c.N===0&&c.E===0)return teamOf(G.maSeat); // tres pardes: guanya el mà
   if(c.N===1&&c.E===1)return w[0];             // 1-1 i empat 3a: guanya la 1a
   return c.N===1?"N":"E";
 }
 return null;
}

/* ---------------- Final de mà ---------------- */
function endHand(winnerTeam){
 G.inHand=false;renderActions();
 setMsg(winnerTeam==="N"?t("guanyaMaN"):t("ells")+" "+t("guanyaMa"));
 // 1r: envit, 2n: truc
 let camaDone=resolveEnvitAtEnd();
 if(!camaDone){
   const v=G.truc.val;
   if(v==="cama"){startCamaWin(winnerTeam);return}
   camaDone=addPoints(winnerTeam,v);
   if(camaDone){startCamaWin(winnerTeam);return}
 } else return;
 setTimeout(startHand,2600);
}
function resolveEnvitAtEnd(){
 if(!G.envit.accepted)return false;
 const evN=Math.max(envitValue(G.hands0snap[0]),envitValue(G.hands0snap[2]));
 const evE=Math.max(envitValue(G.hands0snap[1]),envitValue(G.hands0snap[3]));
 let winner;
 if(evN===evE){ // empat: guanya l'equip del jugador mà (per ordre de lloc)
   winner=teamOf(G.maSeat);
 } else winner=evN>evE?"N":"E";
 let pts=G.envit.val;
 if(pts==="tots"){const lead=G.score.N>=G.score.E?"N":"E";pts=24-G.score[lead]}
 pts=faltaCap(pts);
 toast((winner==="N"?t("guanyamEnvit"):t("ells")+" "+t("guanyenEnvit"))+": "+evN+" vs "+evE+" (+"+pts+")",2800);
 const done=addPoints(winner,pts);
 if(done){setTimeout(()=>startCamaWin(winner),800);return true}
 return false;
}
function concede(team){ // me'n vaig
 if(!G.inHand)return;G.inHand=false;
 const other=otherTeam(team);
 bubble(team==="N"?0:1,t("menvaig"));
 setMsg(team==="N"?t("abandonenN"):t("ells")+" "+t("abandonen"));
 setTimeout(()=>{
   let camaDone=resolveEnvitAtEnd();
   if(!camaDone){
     const v=G.truc.val==="cama"?"cama":G.truc.val;
     if(v==="cama"){startCamaWin(other);return}
     camaDone=addPoints(other,v);
     if(camaDone){startCamaWin(other);return}
   } else return;
   setTimeout(startHand,2300);
 },1400);
}

/* ====================================================================
   APOSTES — TRUC
   ==================================================================== */
function playerProposeTruc(lvl){proposeTruc("N",0,lvl)}
function proposeTruc(team,proposerSeat,lvl){
 G.truc.pending=true;renderActions();
 const seat=proposerSeat;
 bubble(seat,t(TRUC_CHAIN[lvl][0]),true);
 setMsg((seat===0?t("you"):NAMES[seat])+" "+t("diu")+": "+t(TRUC_CHAIN[lvl][0]));
 const responder=otherTeam(team);
 setTimeout(()=>{
   if(responder==="N")playerRespondTruc(lvl,team);
   else aiRespondTruc(lvl,team);
 },1500);
}
function acceptTruc(lvl,callerTeam,accSeat){
 G.truc.level=lvl;G.truc.val=TRUC_CHAIN[lvl][2];
 G.truc.canRaise=otherTeam(callerTeam); // qui accepta té el dret de pujar
 G.truc.pending=false;
 bubble(accSeat,t("vull"));
 setTimeout(()=>{nextTurn()},1300);
}
function rejectTruc(lvl,callerTeam,rejSeat){
 G.truc.pending=false;G.inHand=false;
 bubble(rejSeat,t("novull"));
 setMsg(t("noVolen"));
 setTimeout(()=>{
   let camaDone=resolveEnvitAtEnd();
   if(!camaDone){
     const pts=TRUC_CHAIN[lvl][1];
     camaDone=addPoints(callerTeam,pts);
     if(camaDone){startCamaWin(callerTeam);return}
   } else return;
   setTimeout(startHand,2300);
 },1400);
}
function playerRespondTruc(lvl,callerTeam){
 const btns=[];
 const nxt=lvl+1;
 btns.push([t("vull"),"safe",()=>acceptTruc(lvl,callerTeam,0)]);
 if(nxt<TRUC_CHAIN.length)
   btns.push([t(TRUC_CHAIN[nxt][0]),"atk",()=>proposeTruc("N",0,nxt)]);
 if(G.baza===1&&G.envit.open&&G.envit.level<0)
   btns.push([t("envit")+"!","atk",()=>{
     G.pendingTrucAfterEnvit={lvl,callerTeam};playerProposeEnvit(0);
   }]);
 btns.push([t("novull"),"",()=>rejectTruc(lvl,callerTeam,0)]);
 // consens de parella: na Maria opina amb un gest, tu tens sa darrera paraula
 const stM=handStrength(G.hands0snap[2]);
 const opinio=stM>=30?t("mariaVol"):stM>=20?t("mariaDubta"):t("mariaNo");
 bubble(2,stM>=30?"😏":stM>=20?"🤷":"😬");
 showPrompt(t("trucPregunta")+" "+(TRUC_CHAIN[lvl][2]==="cama"?t("cama"):TRUC_CHAIN[lvl][2]+" "+t("punts"))+" · "+opinio,btns);
}
function aiRespondTruc(lvl,callerTeam){
 // només es crida quan responen els rivals (equip E: Toni i Biel)
 const stToni=handStrength(G.hands0snap[1]),stBiel=handStrength(G.hands0snap[3]);
 const st=Math.max(stToni,stBiel);
 const respSeat=stToni>=stBiel?1:3;
 const stake=TRUC_CHAIN[lvl][2];
 const nxt=lvl+1;
 const farol=Math.random()<.07;
 const agR=G.aggro?G.aggro[respSeat]:1;
 if((st>36||farol)&&nxt<TRUC_CHAIN.length&&Math.random()<.35*agR){proposeTruc("E",respSeat,nxt);return}
 // accepten sovint, però sense suïcidar-se
 const threshold=stake==="cama"?37:(25+lvl*3);
 if(st>threshold-(agR-1)*12-Math.random()*7)acceptTruc(lvl,callerTeam,respSeat);
 else rejectTruc(lvl,callerTeam,respSeat);
}

/* ====================================================================
   APOSTES — ENVIT
   ==================================================================== */
function playerProposeEnvit(lvlIdx){proposeEnvit("N",0,Math.max(0,G.envit.level+1))}
function proposeEnvit(team,seat,lvl){
 G.envit.pending=true;renderActions();
 bubble(seat,t(ENVIT_CHAIN[lvl][0]),true);
 setMsg((seat===0?t("you"):NAMES[seat])+" "+t("diu")+": "+t(ENVIT_CHAIN[lvl][0]));
 const responder=otherTeam(team);
 setTimeout(()=>{
   if(responder==="N")playerRespondEnvit(lvl,team);
   else aiRespondEnvit(lvl,team);
 },1500);
}
function acceptEnvit(lvl,callerTeam,accSeat){
 G.envit.level=lvl;G.envit.val=ENVIT_CHAIN[lvl][2];G.envit.accepted=true;G.envit.pending=false;
 bubble(accSeat,t("vull"));
 finishEnvitPhase();
}
function rejectEnvit(lvl,callerTeam,rejSeat){
 G.envit.pending=false;G.envit.open=false;
 bubble(rejSeat,t("novull"));
 const pts=faltaCap(ENVIT_CHAIN[lvl][1]);
 const done=addPoints(callerTeam,pts);
 if(done){G.inHand=false;setTimeout(()=>startCamaWin(callerTeam),800);return}
 finishEnvitPhase();
}
function finishEnvitPhase(){
 // si hi havia un truc pendent de resposta, el reprenem
 const p=G.pendingTrucAfterEnvit;
 if(p){G.pendingTrucAfterEnvit=null;setTimeout(()=>playerRespondTruc(p.lvl,p.callerTeam),1200);return}
 setTimeout(nextTurn,1100);
}
function playerRespondEnvit(lvl,callerTeam){
 const btns=[];
 btns.push([t("vull"),"safe",()=>acceptEnvit(lvl,callerTeam,0)]);
 const nxt=lvl+1;
 if(nxt<ENVIT_CHAIN.length)btns.push([t(ENVIT_CHAIN[nxt][0]),"atk",()=>proposeEnvit("N",0,nxt)]);
 if(nxt+1<ENVIT_CHAIN.length)btns.push([t("tots"),"atk",()=>proposeEnvit("N",0,ENVIT_CHAIN.length-1)]);
 btns.push([t("novull"),"",()=>rejectEnvit(lvl,callerTeam,0)]);
 // consens de parella: gest de na Maria segons el seu lligat (sense dir el número!)
 const evM=envitValue(G.hands0snap[2]);
 bubble(2,evM>=30?"😏":evM>=26?"🤷":"😬");
 const opinio=evM>=30?t("mariaVol"):evM>=26?t("mariaDubta"):t("mariaNo");
 showPrompt(t("envitPregunta")+" "+(ENVIT_CHAIN[lvl][2]==="tots"?t("tots"):ENVIT_CHAIN[lvl][2]+" "+t("punts"))
   +" — "+t("lligatTeu")+": "+envitValue(G.hands0snap[0])+" · "+opinio,btns);
}
function aiRespondEnvit(lvl,callerTeam){
 const seats=[1,3];
 const ev=Math.max(...seats.map(s=>envitValue(G.hands0snap[s])));
 const respSeat=envitValue(G.hands0snap[1])>=envitValue(G.hands0snap[3])?1:3;
 const nxt=lvl+1;
 const agR=G.aggro?G.aggro[respSeat]:1;
 if(ev>=32&&nxt<ENVIT_CHAIN.length&&Math.random()<.45*agR){proposeEnvit("E",respSeat,nxt);return}
 const threshold=28+lvl*2;
 if(ev>threshold-(agR-1)*8-Math.random()*4||Math.random()<.06*agR)acceptEnvit(lvl,callerTeam,respSeat);
 else rejectEnvit(lvl,callerTeam,respSeat);
}

/* ====================================================================
   IA — torn de joc
   ==================================================================== */
function aiTurn(seat){
 if(!G.inHand||G.matchOver||G.truc.pending||G.envit.pending)return;
 const team=teamOf(seat);
 const hand=G.hands[seat];
 const st=handStrength(G.hands0snap[seat]);
 const ag=G.aggro?G.aggro[seat]:1; // caràcter del jugador (canvia a cada partida)
 // 1) envit? (només 1a volta)
 if(G.baza===1&&G.envit.open&&G.envit.level<0){
   // sa companya obeeix sa senya d'envit
   if(seat===2&&G.askEnvit){G.askEnvit=false;proposeEnvit(team,seat,0);return}
   let ev=envitValue(G.hands0snap[seat]);
   if(seat===2&&G.mariaKnows)ev=Math.max(ev,envitValue(G.hands0snap[0]));
   // lo normal és que envidin es 3r o 4t de sa volta; es primers només
   // si duen peça grossa (amo/madona) que lliga amb tot i l'hauran de tirar
   const pos=(seat-G.leader+4)%4;
   const pecaGrossa=G.hands0snap[seat].some(c=>isAmo(c)||isMadona(c));
   const posFactor=pos>=2?1:(pecaGrossa?0.8:0.08);
   if(ev>=29&&Math.random()<.7*posFactor*ag||Math.random()<.04*posFactor*ag){proposeEnvit(team,seat,0);return}
 }
 // 2) truc?
 const lvl=G.truc.level+1;
 const canRaise=(G.truc.canRaise===null||G.truc.canRaise===team)&&lvl<TRUC_CHAIN.length;
 if(canRaise){
   let s2=st;
   if(seat===2&&G.mariaKnows)s2=Math.max(s2,handStrength(G.hands0snap[0]));
   const wantLvl=lvl===0?33:37+lvl*2;
   // trucar més tard (a 2a/3a volta) és més habitual: així es juguen les tres voltes
   const lateBonus=G.baza>=2?0.25:0;
   if((s2>wantLvl&&Math.random()<(.25+lateBonus)*ag)||Math.random()<.03*ag){proposeTruc(team,seat,lvl);return}
 }
 // 3) jugar carta
 const idx=aiChooseCard(seat);
 playCard(seat,idx);
}
function aiChooseCard(seat){
 const hand=G.hands[seat];
 const onTable=G.played.filter(Boolean);
 const byRank=hand.map((c,i)=>({i,r:rank(c)})).sort((a,b)=>a.r-b.r);
 // sa companya obeeix es "vine a mi" / "pitja" des company
 if(seat===2&&G.partnerHint){
   const h=G.partnerHint;G.partnerHint=null;
   if(h==="low")return byRank[0].i;
   const maxT=Math.max(0,...G.played.map(c=>c?rank(c):0));
   const killer=byRank.find(x=>x.r>maxT);
   return killer?killer.i:byRank[byRank.length-1].i;
 }
 if(onTable.length===0){ // obre la basa
   if(Math.random()<.35)return byRank[byRank.length-1].i; // pitja!
   return byRank[Math.floor(byRank.length/2)].i;
 }
 const maxTable=Math.max(...G.played.map(c=>c?rank(c):0));
 // el company ja guanya? tira fluixa ("vine a mi")
 const partner=(seat+2)%4;
 const partnerWins=G.played[partner]&&rank(G.played[partner])===maxTable
   &&!G.played.some((c,s)=>c&&teamOf(s)!==teamOf(seat)&&rank(c)===maxTable);
 if(partnerWins)return byRank[0].i;
 // mata amb la carta més baixa possible
 const killer=byRank.find(x=>x.r>maxTable);
 if(killer)return killer.i;
 // empata si pot (qui no mata empata!)
 const tie=byRank.find(x=>x.r===maxTable);
 if(tie)return tie.i;
 return byRank[0].i;
}

/* ====================================================================
   MÚSICA — guitarreta sintetitzada (Web Audio)
   ==================================================================== */
let AC=null,musicTimer=null,musicOn=false,masterGain=null;
/* Guitarra de veritat: síntesi Karplus-Strong (corda polsada) */
const KS_CACHE={};
function ksBuffer(freq){
 const key=Math.round(freq*10);
 if(KS_CACHE[key])return KS_CACHE[key];
 const sr=AC.sampleRate,dur=1.6,N=Math.round(sr/freq);
 const buf=AC.createBuffer(1,Math.floor(sr*dur),sr),d=buf.getChannelData(0);
 for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
 for(let i=N;i<d.length;i++)d[i]=0.996*0.5*(d[i-N]+d[i-N+1]);
 KS_CACHE[key]=buf;return buf;
}
function pluck(freq,when,vol){
 const src=AC.createBufferSource();src.buffer=ksBuffer(freq);
 const g=AC.createGain();g.gain.value=vol;
 src.connect(g);g.connect(masterGain);
 src.start(when);
}
/* cadència andalusa Am — G — F — E, arpegi tranquil de taverna */
const BARS=[
 [110.00,220.00,261.63,329.63,261.63,220.00], // Am
 [ 98.00,196.00,246.94,293.66,246.94,196.00], // G
 [ 87.31,174.61,220.00,261.63,220.00,174.61], // F
 [ 82.41,164.81,207.65,246.94,207.65,164.81], // E
];
let nextChordTime=0,chordIdx=0;
function musicLoop(){
 if(!musicOn)return;
 const NOTE=0.27,LOOKAHEAD=0.8;
 while(nextChordTime<AC.currentTime+LOOKAHEAD){
   const bar=BARS[chordIdx%BARS.length];
   bar.forEach((f,k)=>pluck(f,nextChordTime+k*NOTE,k===0?0.30:0.16));
   nextChordTime+=6*NOTE;chordIdx++;
 }
}
/* Cançons oficials de Joana Pons a YouTube (canal del segell):
   Romanç de na Cecília + Menorca (amb ses guitarres) + Menorca (Del Folk al Pop) */
const JP_VIDEOS=["iu0Zt-BtH0M","AebXCIEO7ww","AX6ysLLWAgY"];
function setMusic(mode){ // "gtr" | "jp" | "off"
 G.musicMode=mode;
 $("#btnMusic").textContent=mode==="gtr"?"🎸":mode==="jp"?"🎵":"🔇";
 $("#btnMusic").style.opacity=mode==="off"?.45:1;
 // guitarreta sintetitzada
 if(mode==="gtr"){
   if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
     masterGain=AC.createGain();masterGain.gain.value=0.5;
     const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;
     masterGain.connect(lp);lp.connect(AC.destination);}
   AC.resume();musicOn=true;nextChordTime=Math.max(nextChordTime,AC.currentTime+0.1);
   if(!musicTimer)musicTimer=setInterval(musicLoop,200);
 }else{musicOn=false}
 // Joana Pons: si el joc està publicat a una web (http/https) el mini-reproductor
 // funciona incrustat; des d'un fitxer local YouTube el bloqueja (error 153)
 // i l'obrim en una altra pestanya perquè soni de fons.
 const hosted=location.protocol.startsWith("http");
 const ex=document.getElementById("ytPlayer");
 if(mode==="jp"){
   if(hosted){
     if(!ex){
       const d=document.createElement("div");d.id="ytPlayer";
       d.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${JP_VIDEOS[0]}?playlist=${JP_VIDEOS.slice(1).join(",")},${JP_VIDEOS[0]}&autoplay=1&loop=1" allow="autoplay; encrypted-media" allowfullscreen title="Joana Pons"></iframe>`;
       document.body.appendChild(d);
     }
   }else{
     window.open("https://www.youtube.com/watch_videos?video_ids="+JP_VIDEOS.join(","),"_blank");
   }
 }else if(ex)ex.remove();
}

/* ---------------- Baralla real: es descarrega de Wikimedia en obrir ----------------
   (CC BY-SA 3.0, Basquetteur). Si no hi ha internet ni cartas_data.js,
   es fan servir les cartes SVG dibuixades. */
(async function loadDeckImages(){
 if(window.CARD_IMG&&window.CARD_IMG.O1)return; // ja les tenim (cartas_data.js)
 try{
  const img=new Image();img.crossOrigin="anonymous";
  img.src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Baraja_espa%C3%B1ola_completa.png";
  await img.decode();
  const PX=208,PY=319,ROWS={O:0,C:1,E:2,B:3};
  const crop=(s,col)=>{
    const cv=document.createElement("canvas");cv.width=146;cv.height=224;
    cv.getContext("2d").drawImage(img,col*PX,ROWS[s]*PY,PX,PY,0,0,146,224);
    return cv.toDataURL("image/webp",0.8);
  };
  window.CARD_IMG=window.CARD_IMG||{};
  for(const s of["O","C","E","B"])for(let n=1;n<=7;n++)window.CARD_IMG[s+n]=crop(s,n-1);
  window.CARD_IMG["B11"]=crop("B",10); // l'amo
  window.CARD_IMG["O10"]=crop("O",9);  // sa madona
  // refrescar el que hi hagi en pantalla
  if(G.inHand){renderTable();renderHand(G.turn===0&&!G.promptActive)}
 }catch(e){/* sense connexió: cartes SVG de respatler */}
})();
